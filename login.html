<!doctype html>
<!-- Login page served by server.mjs to anyone without a session cookie. Self-contained on purpose: nothing from
     dist/ (room photos, 3D model) may load before login. {{…}} placeholders are filled (HTML-escaped) by server.mjs. -->
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Logg inn – Interiørspillet</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --font: 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;
        --font-display: 'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;
        --ink: #eef3f7;
        --ink-2: #b7c4d0;
        --ink-3: #8394a4;
        --bg: #0a1017;
        --line: rgba(255, 255, 255, 0.085);
        --line-2: rgba(255, 255, 255, 0.15);
        --accent: #ffb52e;
        --accent-ink: #1d1402;
        --danger: #ff6a5c;
        --danger-soft: rgba(255, 106, 92, 0.14);
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        font-family: var(--font);
        font-size: clamp(14px, min(calc(0.78vw + 4px), calc(1.39vh + 4px)), 26px);
        line-height: 1.4;
        color: var(--ink);
        background:
          radial-gradient(70% 60% at 85% 30%, rgba(255, 170, 40, 0.09) 0%, rgba(255, 170, 40, 0) 70%),
          radial-gradient(90% 80% at 70% 80%, rgba(70, 120, 170, 0.12) 0%, rgba(70, 120, 170, 0) 70%),
          linear-gradient(160deg, #111b26 0%, var(--bg) 60%);
        background-attachment: fixed;
        -webkit-font-smoothing: antialiased;
      }

      main {
        min-height: 100%;
        max-width: 118em;
        margin: 0 auto;
        padding: 3em 2.8em;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
      }

      main > * {
        animation: rise 0.7s var(--ease-out) both;
      }
      main > :nth-child(2) { animation-delay: 0.06s; }
      main > :nth-child(3) { animation-delay: 0.12s; }
      main > :nth-child(4) { animation-delay: 0.18s; }
      main > :nth-child(5) { animation-delay: 0.24s; }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(0.9em);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .logo {
        display: block;
        width: 5.2em;
        height: 5.2em;
        margin-bottom: 0.9em;
        filter: drop-shadow(0 0.3em 0.9em rgba(255, 160, 30, 0.25));
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 0.5em;
        margin-bottom: 1.1em;
        padding: 0.35em 0.85em 0.35em 0.6em;
        border-radius: 2em;
        border: 1px solid var(--line-2);
        background: rgba(10, 16, 23, 0.5);
        font-size: 0.82em;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: var(--ink-2);
      }

      .eyebrow svg {
        width: 1.1em;
        height: 1.1em;
        color: var(--accent);
      }

      h1 {
        margin: 0;
        font: 900 4.2em/1 var(--font-display);
        letter-spacing: 0.01em;
        color: #fff;
        text-shadow: 0 0.06em 0.4em rgba(0, 0, 0, 0.5);
      }

      h1 span {
        color: var(--accent);
      }

      .sub {
        margin: 0.55em 0 0;
        font-size: 1.35em;
        color: var(--ink-2);
      }

      form {
        width: min(26em, 100%);
        margin-top: 2.2em;
        padding: 1.5em;
        display: grid;
        gap: 1em;
        border: 1px solid var(--line-2);
        border-radius: 1em;
        background: rgba(13, 20, 29, 0.74);
        box-shadow: 0 1.4em 3.5em rgba(0, 0, 0, 0.45), 0 0.2em 0.6em rgba(0, 0, 0, 0.25);
      }

      label {
        display: grid;
        gap: 0.4em;
        font-size: 0.86em;
        font-weight: 600;
        letter-spacing: 0.03em;
        color: var(--ink-2);
      }

      input {
        height: 3em;
        padding: 0 0.9em;
        border: 1px solid var(--line-2);
        border-radius: 0.7em;
        background: rgba(255, 255, 255, 0.045);
        color: var(--ink);
        font: inherit;
        font-size: 1.16em;
        font-weight: 400;
        letter-spacing: normal;
        transition: border-color 0.15s, background 0.15s;
      }

      input:hover {
        background: rgba(255, 255, 255, 0.075);
      }

      input:focus {
        outline: none;
        border-color: var(--accent);
        background: rgba(255, 255, 255, 0.075);
      }

      .error {
        margin: 0;
        padding: 0.7em 0.9em;
        border-radius: 0.7em;
        background: var(--danger-soft);
        color: var(--danger);
        font-size: 0.92em;
        font-weight: 600;
      }

      button {
        margin-top: 0.4em;
        height: 3.6em;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.6em;
        border: 0;
        border-radius: 1em;
        color: var(--accent-ink);
        background: linear-gradient(180deg, #ffc955 0%, #ffab1f 100%);
        box-shadow: 0 0.7em 2.2em rgba(255, 166, 30, 0.35), 0 0.15em 0 #c7790b, inset 0 1px 0 rgba(255, 255, 255, 0.5);
        font: inherit;
        font-size: 1.1em;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        cursor: pointer;
        transition: transform 0.18s, filter 0.18s;
      }

      button:hover {
        transform: translateY(-1px);
        filter: brightness(1.05);
      }

      button:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 3px;
      }

      button:disabled {
        cursor: progress;
        filter: saturate(0.6);
        transform: none;
      }

      button svg {
        width: 1.1em;
        height: 1.1em;
      }

      .note {
        margin: 1.6em 0 0;
        font-size: 0.82em;
        color: var(--ink-3);
      }

      @media (max-width: 600px) {
        main {
          padding: 2em 16px;
        }

        h1 {
          font-size: 3em;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        main > * {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffd877" /><stop offset="1" stop-color="#ff9b1a" />
          </linearGradient>
          <radialGradient id="lr" cx="0.5" cy="0.45" r="0.6">
            <stop offset="0" stop-color="#2a3a48" /><stop offset="1" stop-color="#121b24" />
          </radialGradient>
        </defs>
        <circle cx="32" cy="32" r="29" fill="url(#lr)" />
        <circle cx="32" cy="32" r="28" fill="none" stroke="url(#lg)" stroke-width="3" />
        <path d="M15.5 31.5 32 17.5l16.5 14V47a2 2 0 0 1-2 2h-29a2 2 0 0 1-2-2z" fill="none" stroke="#7fb6e0" stroke-opacity="0.6" stroke-width="2.6" stroke-linejoin="round" />
        <path d="M23.5 44.5v-5.2a3.3 3.3 0 0 1 3.3-3.3h10.4a3.3 3.3 0 0 1 3.3 3.3v5.2" fill="none" stroke="url(#lg)" stroke-width="3.2" stroke-linecap="round" />
        <path d="M21 44.5h22M24.5 48v-3.5M39.5 48v-3.5M26.5 36v-3a2.5 2.5 0 0 1 2.5-2.5h6a2.5 2.5 0 0 1 2.5 2.5v3" fill="none" stroke="url(#lg)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <div class="eyebrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="5" y="11" width="14" height="10" rx="2" /><path d="M8 11V7a4 4 0 0 1 8 0v4" />
        </svg>
        <span>Privat – bare for inviterte</span>
      </div>
      <h1>Interiør<span>spillet</span></h1>
      <p class="sub">Logg inn for å gå inn i stua</p>
      <!-- no action: posts to the URL that was asked for, and server.mjs sends the browser back to it after login -->
      <form method="post">
        {{FEIL}}
        <label>
          Brukernavn
          <input name="bruker" value="{{BRUKER}}" autocomplete="username" autocapitalize="none" spellcheck="false" required />
        </label>
        <label>
          Passord
          <input name="passord" type="password" autocomplete="current-password" required />
        </label>
        <button type="submit">
          <span>Logg inn</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6" />
          </svg>
        </button>
      </form>
      <p class="note">Du blir husket på denne maskinen i 30 dager.</p>
    </main>
    <script>
      // focus the first empty field (the password after a failed attempt, since the username is kept)
      const form = document.forms[0];
      const empty = [...form.querySelectorAll('input')].find((i) => !i.value);
      (empty || form.passord).focus();
      form.addEventListener('submit', () => {
        const btn = form.querySelector('button');
        btn.disabled = true;
        btn.firstElementChild.textContent = 'Logger inn …';
      });
    </script>
  </body>
</html>
