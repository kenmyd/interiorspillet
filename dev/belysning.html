<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Interiørspillet – belysning</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1d2430; color: #222; font: 12px system-ui, sans-serif; }
      canvas { display: block; }
      #bar { position: fixed; left: 8px; top: 8px; display: flex; flex-wrap: wrap; gap: 4px; z-index: 3; max-width: calc(100% - 290px); }
      #bar button { font: 600 12px system-ui, sans-serif; padding: 5px 9px; border: 0; border-radius: 4px; background: #fffe; color: #222; cursor: pointer; box-shadow: 0 1px 3px #0003; }
      #bar button.on { background: #2b5f8a; color: #fff; }
      #groups { position: fixed; right: 8px; top: 8px; bottom: 40px; width: 262px; overflow: auto; background: #fffe; border-radius: 6px; padding: 6px 8px; z-index: 3; box-shadow: 0 1px 4px #0005; }
      #groups h3 { margin: 4px 0 6px; font-size: 13px; }
      .grp { display: grid; grid-template-columns: 18px 1fr 70px; align-items: center; gap: 4px; padding: 2px 0; border-bottom: 1px solid #0001; }
      .grp label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .grp input[type=range] { width: 70px; }
      #info { position: fixed; left: 8px; bottom: 8px; background: #fffd; padding: 4px 8px; border-radius: 4px; pointer-events: none; white-space: pre; z-index: 2; }
    </style>
    <script>
      // public/ files are served from the app root: dev pages live one folder down
      window.__ASSET_BASE__ = '../';
    </script>
  </head>
  <body>
    <div id="bar"></div>
    <div id="groups"></div>
    <div id="info"></div>
    <script type="module" src="/src/dev/belysning.js"></script>
  </body>
</html>
